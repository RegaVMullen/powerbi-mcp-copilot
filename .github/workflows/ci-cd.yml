name: "Power BI MCP CI/CD Pipeline"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      powerbi-mcp:
        image: node:20-alpine
        options: >-
          --health-cmd="node --version"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Run authentication tests
        run: npm run test:auth
        env:
          POWERBI_CLIENT_ID: ${{ secrets.POWERBI_CLIENT_ID }}
          POWERBI_CLIENT_SECRET: ${{ secrets.POWERBI_CLIENT_SECRET }}
          POWERBI_TENANT_ID: ${{ vars.POWERBI_TENANT_ID }}
        continue-on-error: true

      - name: Run API tests
        run: npm test
        env:
          POWERBI_CLIENT_ID: ${{ secrets.POWERBI_CLIENT_ID }}
          POWERBI_CLIENT_SECRET: ${{ secrets.POWERBI_CLIENT_SECRET }}
          POWERBI_TENANT_ID: ${{ vars.POWERBI_TENANT_ID }}
          POWERBI_WORKSPACE_ID: ${{ vars.POWERBI_WORKSPACE_ID }}
        continue-on-error: true

      - name: Run performance tests
        run: npm run test:perf
        env:
          POWERBI_CLIENT_ID: ${{ secrets.POWERBI_CLIENT_ID }}
          POWERBI_CLIENT_SECRET: ${{ secrets.POWERBI_CLIENT_SECRET }}
          POWERBI_TENANT_ID: ${{ vars.POWERBI_TENANT_ID }}
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: powerbi-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
